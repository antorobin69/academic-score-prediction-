name: Django ML Automated Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:

      - name: Download project code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Python libraries
        run: |
          python -m pip install -r requirements.txt

      - name: Check Django configuration
        run: |
          python manage.py check

      - name: Train the ML model
        run: |
          python train.py

      - name: Check actual ML prediction
        run: |
          python predict.py

      - name: Run Django automated tests
        run: |
          python manage.py test predictor
