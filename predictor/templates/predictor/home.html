
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Student Marks Prediction</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f1f5f9;
            padding: 40px 15px;
        }

        .container {
            max-width: 500px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        h1 {
            text-align: center;
            color: #2563eb;
        }

        .subtitle {
            text-align: center;
            color: #64748b;
        }

        input {
            display: block;
            width: 100%;
            padding: 12px;
            margin: 8px 0 18px;
            box-sizing: border-box;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
        }

        button {
            width: 100%;
            padding: 12px;
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }

        .result {
            margin-top: 25px;
            padding: 20px;
            background: #dcfce7;
            border-radius: 8px;
            text-align: center;
        }

        .score {
            font-size: 30px;
            font-weight: bold;
            color: #166534;
        }

        .error {
            color: red;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>Student Marks Prediction</h1>

        <p class="subtitle">
            Enter student details to predict final marks.
        </p>

        <form method="POST">

            {% csrf_token %}

            {{ form.as_p }}

            <button type="submit">
                Predict Final Marks
            </button>

        </form>

        {% if prediction is not None %}

            <div class="result">

                <h2>Predicted Final Marks</h2>

                <p class="score">
                    {{ prediction }} / 100
                </p>

            </div>

        {% endif %}

        {% if error %}
            <p class="error">{{ error }}</p>
        {% endif %}

    </div>

</body>
</html>
